[program:h3-prewarm]
; One read of the H3 weights into the page cache after every boot (scripts/h3_prewarm.sh).
directory=/workspace/h3
command=/bin/bash /workspace/h3/scripts/h3_prewarm.sh
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/h3-prewarm.log
redirect_stderr=true
stdout_logfile_maxbytes=1048576
stdout_logfile_backups=1
