[program:h3-qwen-director]
directory=/workspace/h3
; Launcher: run_h3_qwen_director.sh (vllm serve ... --enable-sleep-mode).
; 0.30 of the GPU (~28 GB awake, ~1.3 GB asleep with the vLLM 0.15 sleep patch): starts even
; while ComfyUI keeps H3 weights resident; the default 0.90 crash-looped next to a warm ComfyUI.
; 32k context covers the plan prompt plus reference frames.
command=/workspace/h3/scripts/run_h3_qwen_director.sh
autostart=true
autorestart=true
; vLLM stays alive while loading; a crash in the first minute (e.g. no free VRAM next to a warm
; ComfyUI) counts as a failed start, so Supervisor goes FATAL after 3 tries instead of looping
; VRAM grabs during a render. Keep below the 120 s supervisorctl timeout of app/qwen_lifecycle.py.
startsecs=60
startretries=3
; Engine core + API server release CUDA memory on SIGTERM.
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/h3-qwen-director.log
stderr_logfile=/var/log/h3-qwen-director.err.log
stdout_logfile_maxbytes=20971520
stderr_logfile_maxbytes=20971520
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=VLLM_SERVER_DEV_MODE="1",VLLM_USE_FLASHINFER_SAMPLER="0",HF_HOME="/workspace/h3/hf-cache",PATH="/workspace/h3/qwen-venv/bin:/usr/local/bin:/usr/bin:/bin",H3_QWEN_GPU_UTIL="0.30",H3_QWEN_MAX_MODEL_LEN="32768"
