[program:h3-qwen-vram-guard]
directory=/workspace/h3/api
command=/workspace/h3/api-venv/bin/python -m app.qwen_lifecycle
environment=H3_QWEN_AUTOMANAGE="1"
; Off by default: Qwen sleeps in VRAM (~1.3 GB) and wakes in 0.3 s per job.
; Enable only with H3_QWEN_AUTOMANAGE=1 (h3_new_server.sh --qwen guard).
autostart=false
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/h3-qwen-vram-guard.log
stderr_logfile=/var/log/h3-qwen-vram-guard.err.log
stdout_logfile_maxbytes=20971520
stderr_logfile_maxbytes=20971520
stdout_logfile_backups=3
stderr_logfile_backups=3
