[program:h3-watchdog]
directory=/workspace/h3
command=/usr/bin/python3 /workspace/h3/scripts/h3_runtime_watchdog.py
environment=H3_COMFY_URL="http://127.0.0.1:18188",H3_GPU_API_URL="http://127.0.0.1:18189",H3_QWEN_URL="http://127.0.0.1:8000",H3_WATCHDOG_INTERVAL="15",H3_QWEN_FAILURE_LIMIT="12",H3_API_FAILURE_LIMIT="4",H3_WATCHDOG_STARTUP_GRACE="600",H3_WATCHDOG_RESTART_COOLDOWN="900"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/h3-watchdog.log
stderr_logfile=/var/log/h3-watchdog.err.log
stdout_logfile_maxbytes=5242880
stderr_logfile_maxbytes=5242880
stdout_logfile_backups=3
stderr_logfile_backups=3
